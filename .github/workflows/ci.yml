name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  DATABASE_URL: postgres://providentra:providentra@localhost:5432/providentra
  ENV_ENCRYPTION_KEY: dGVzdC1lbnYtZW5jcnlwdGlvbi1rZXktMzJieXRlcSE=
  EXECUTOR_TOKEN: ci-executor-token-for-tests

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Typecheck
        run: pnpm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Unit tests
        run: pnpm exec vitest run tests/unit

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: providentra
          POSTGRES_PASSWORD: providentra
          POSTGRES_DB: providentra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U providentra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Run migrations
        run: pnpm run db:migrate

      - name: Integration tests
        run: pnpm exec vitest run tests/integration
